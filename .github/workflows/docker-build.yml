name: Docker Image CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Fetch existing tags from Docker Hub
        id: get_tags
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DATE_TAG=$(date +"%y.%m")
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${DOCKER_USER}/php-epg/tags/?page_size=100" | jq -r '.results[].name // empty')
          COUNT=0
          for tag in $TAGS; do
            if [[ $tag == $DATE_TAG* ]]; then
              COUNT=$((COUNT + 1))
            fi
          done
          if [ $COUNT -eq 0 ]; then
            NEW_TAG="${DATE_TAG}"
          else
            NEW_TAG="${DATE_TAG}.${COUNT}"
          fi
          echo "TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Process files
        run: |
          VERSION=$(TZ="Asia/Shanghai" date +"v%Y.%m.%d")

          find epg -type f \
            ! -path "epg/assets/opencc/*" \
            ! -path "epg/assets/tinyfilemanager/*" \
            -exec perl -i -pe 's/^\x{FEFF}// if -T' {} +

          sed -i "s|<span id=\"version\">.*</span>|<span id=\"version\">${VERSION}</span>|" epg/assets/html/manage.html
          sed -i "s|assets/css/manage.css|assets/css/manage.css?ver=${VERSION}|g" epg/assets/html/manage.html
          sed -i "s|assets/js/manage.js|assets/js/manage.js?ver=${VERSION}|g" epg/assets/html/manage.html

          sed -i "s|assets/css/login.css|assets/css/login.css?ver=${VERSION}|g" epg/assets/html/login.html

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64, linux/arm64, linux/arm/v7
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/php-epg:${{ env.TAG }},${{ secrets.DOCKERHUB_USERNAME }}/php-epg:latest
